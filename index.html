<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="color-scheme" content="dark" />
  <title>ZOYA AI RAX — Danger Tactical Core</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg-void: #020308;
      --bg-panel: rgba(7, 10, 20, 0.9);
      --cyan: #00f3ff;
      --danger: #ff004c;
      --amber: #ffaa00;
      --emerald: #00ff88;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 0, 76, 0.16) 0%, transparent 45%),
        radial-gradient(circle at 50% 65%, rgba(0, 243, 255, 0.1) 0%, #03050c 65%, var(--bg-void) 100%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Tactical Hex/Grid Overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 0, 76, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.04) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 0;
    }

    /* Top Header */
    header {
      position: relative;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(2, 4, 10, 0.92);
      border-bottom: 1px solid rgba(255, 0, 76, 0.45);
      box-shadow: 0 4px 24px rgba(255, 0, 76, 0.18);
      backdrop-filter: blur(12px);
      gap: 6px;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .danger-beacon {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 10px var(--danger), 0 0 22px var(--danger);
      animation: pulseBeacon 1.4s infinite;
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #ffffff 10%, var(--cyan) 55%, var(--danger) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 8px rgba(0, 243, 255, 0.45));
    }

    /* Futuristic Glowing Chronograph Watch Widget */
    .chrono-watch {
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(10, 16, 32, 0.96), rgba(24, 6, 18, 0.94));
      border: 1.5px solid var(--cyan);
      border-radius: 14px;
      padding: 4px 10px;
      box-shadow:
        0 0 14px rgba(0, 243, 255, 0.4),
        inset 0 0 12px rgba(255, 0, 76, 0.25);
    }

    .watch-dial {
      position: relative;
      width: 34px;
      height: 34px;
      flex-shrink: 0;
    }

    .watch-dial svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .watch-sec-ring {
      transform-origin: 20px 20px;
      transition: transform 0.25s cubic-bezier(0.4, 2.08, 0.55, 0.44);
    }

    .watch-readout {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .watch-time-row {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .watch-digits {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.86rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 8px var(--cyan), 0 0 16px var(--cyan);
      letter-spacing: 0.8px;
    }

    .watch-ampm {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.6rem;
      font-weight: 800;
      color: var(--danger);
      text-shadow: 0 0 8px var(--danger);
    }

    .watch-date {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--amber);
      text-shadow: 0 0 6px rgba(255, 170, 0, 0.6);
      letter-spacing: 0.4px;
    }

    .admin-btn {
      background: rgba(255, 0, 76, 0.16);
      border: 1px solid var(--danger);
      color: #fff;
      padding: 6px 10px;
      border-radius: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(255, 0, 76, 0.35);
      transition: 0.2s;
    }

    .admin-btn:active {
      transform: scale(0.95);
      background: var(--danger);
    }

    /* Main Workspace */
    main {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 1150px;
      margin: 0 auto;
      padding: 6px 12px 12px;
      gap: 8px;
      overflow: hidden;
    }

    @media (min-width: 780px) {
      main {
        flex-direction: row;
        align-items: stretch;
        padding: 14px 18px 18px;
      }
      .core-zone { width: 45%; justify-content: center; }
      .display-zone { width: 55%; }
    }

    /* Core Visual Zone */
    .core-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .hud-stage {
      position: relative;
      width: 100%;
      max-width: 390px;
      height: 195px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (min-width: 780px) {
      .hud-stage { height: 295px; max-width: 440px; }
    }

    #zoyaHudSvg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 0 14px rgba(0, 243, 255, 0.4));
      transition: filter 0.3s ease;
    }

    .ring-cw {
      transform-origin: 250px 130px;
      animation: spinCW 12s linear infinite;
    }

    .ring-ccw {
      transform-origin: 250px 130px;
      animation: spinCCW 7.5s linear infinite;
    }

    /* STATE 1: LISTENING (Emerald Green Pulse + Wave Bars) */
    .hud-stage.listening #zoyaHudSvg {
      filter: drop-shadow(0 0 22px rgba(0, 255, 136, 0.8));
    }
    .hud-stage.listening .ring-cw {
      animation-duration: 4s;
      stroke: var(--emerald);
    }
    .hud-stage.listening #outerArc { stroke: var(--emerald); }
    .hud-stage.listening #innerArc { stroke: var(--cyan); }
    .hud-stage.listening #coreShell {
      stroke: var(--emerald);
      fill: rgba(0, 255, 136, 0.22);
      animation: corePulse 0.55s ease-in-out infinite alternate;
    }
    .hud-stage.listening #coreLabel { fill: var(--emerald); }

    /* STATE 2: SPEAKING (Danger Crimson High-Energy Reactor) */
    .hud-stage.speaking #zoyaHudSvg {
      filter: drop-shadow(0 0 26px rgba(255, 0, 76, 0.9));
    }
    .hud-stage.speaking .ring-cw { animation-duration: 2.4s; }
    .hud-stage.speaking .ring-ccw { animation-duration: 1.6s; }
    .hud-stage.speaking #outerArc { stroke: var(--danger); }
    .hud-stage.speaking #innerArc { stroke: var(--amber); }
    .hud-stage.speaking #coreShell {
      stroke: var(--danger);
      fill: rgba(255, 0, 76, 0.32);
      animation: corePulse 0.28s ease-in-out infinite alternate;
    }
    .hud-stage.speaking #coreLabel { fill: #ffffff; }

    /* Live Audio Spectrum Bars inside Core */
    .core-bars rect {
      transform-origin: center;
      transition: height 0.1s ease;
    }
    .hud-stage.listening .core-bars rect {
      fill: var(--emerald);
      animation: eqDance 0.45s ease-in-out infinite alternate;
    }
    .hud-stage.speaking .core-bars rect {
      fill: var(--danger);
      animation: eqDance 0.25s ease-in-out infinite alternate;
    }
    .core-bars rect:nth-child(2) { animation-delay: 0.1s; }
    .core-bars rect:nth-child(3) { animation-delay: 0.2s; }
    .core-bars rect:nth-child(4) { animation-delay: 0.05s; }
    .core-bars rect:nth-child(5) { animation-delay: 0.15s; }

    /* Live Camera Preview */
    .camera-wrapper {
      display: none;
      position: relative;
      width: 100%;
      max-width: 330px;
      height: 185px;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid var(--danger);
      box-shadow: 0 0 26px rgba(255, 0, 76, 0.6);
      background: #000;
    }

    .camera-wrapper.active { display: block; }

    #cameraFeed {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cam-controls {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      width: max-content;
    }

    .cam-mini-btn {
      background: rgba(2, 4, 10, 0.88);
      border: 1px solid var(--cyan);
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.66rem;
      padding: 5px 9px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Telemetry Status Pills */
    .telemetry-bar {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-top: 2px;
    }

    .badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(0, 243, 255, 0.08);
      border: 1px solid rgba(0, 243, 255, 0.4);
      color: var(--cyan);
    }

    .badge.listening-badge {
      border-color: var(--emerald);
      color: var(--emerald);
      background: rgba(0, 255, 136, 0.14);
      box-shadow: 0 0 12px rgba(0, 255, 136, 0.35);
    }

    .badge.speaking-badge {
      border-color: var(--danger);
      color: #ff80a6;
      background: rgba(255, 0, 76, 0.18);
      box-shadow: 0 0 12px rgba(255, 0, 76, 0.4);
    }

    .badge.model-badge {
      border-color: rgba(255, 170, 0, 0.5);
      color: var(--amber);
      background: rgba(255, 170, 0, 0.1);
    }

    .badge.error-badge {
      border-color: var(--danger);
      color: #ff6b95;
      background: rgba(255, 0, 76, 0.18);
    }

    /* Dedicated Conversation & Diagnostics Display */
    .display-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
      border: 1px solid rgba(255, 0, 76, 0.35);
      border-radius: 16px;
      box-shadow: inset 0 0 25px rgba(255, 0, 76, 0.07), 0 0 25px rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .display-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 14px;
      background: linear-gradient(90deg, rgba(255, 0, 76, 0.14), rgba(0, 243, 255, 0.08));
      border-bottom: 1px solid rgba(255, 0, 76, 0.25);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.66rem;
      letter-spacing: 0.8px;
      color: var(--cyan);
    }

    .chat-stream {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.92rem;
      line-height: 1.45;
      word-wrap: break-word;
      animation: fadeSlide 0.2s ease-out;
    }

    .msg-tag {
      display: block;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 1px;
      margin-bottom: 4px;
      opacity: 0.85;
    }

    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(255, 0, 76, 0.28), rgba(124, 58, 237, 0.38));
      border: 1px solid rgba(255, 0, 76, 0.6);
      color: #fff;
      border-bottom-right-radius: 3px;
    }

    .msg.zoya {
      align-self: flex-start;
      background: rgba(9, 16, 34, 0.95);
      border: 1px solid rgba(0, 243, 255, 0.45);
      color: #f8fafc;
      box-shadow: 0 0 14px rgba(0, 243, 255, 0.12);
      border-bottom-left-radius: 3px;
    }

    .msg.system-alert {
      align-self: center;
      max-width: 96%;
      background: rgba(255, 0, 76, 0.16);
      border: 1px solid var(--danger);
      color: #ffc2d4;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
    }

    /* Bottom Control Deck */
    .control-deck {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px 10px 64px;
      background: rgba(2, 4, 10, 0.94);
      border-top: 1px solid rgba(255, 0, 76, 0.28);
    }

    .icon-action-btn {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.25);
      transition: 0.2s;
    }

    .icon-action-btn.active {
      background: var(--danger);
      border-color: #fff;
      color: #fff;
      box-shadow: 0 0 18px var(--danger);
    }

    .control-deck input {
      flex: 1;
      min-width: 0;
      background: rgba(12, 18, 34, 0.96);
      border: 1px solid rgba(0, 243, 255, 0.38);
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.92rem;
      outline: none;
    }

    .control-deck input:focus {
      border-color: var(--danger);
      box-shadow: 0 0 14px rgba(255, 0, 76, 0.35);
    }

    .send-btn {
      background: linear-gradient(135deg, var(--danger), #9333ea);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 0 16px;
      height: 42px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 0.76rem;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(255, 0, 76, 0.45);
    }

    /* Bottom-Left Continuous Live Voice Response Button */
    .live-voice-btn {
      position: fixed;
      bottom: 11px;
      left: 12px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #050814;
      border: 2px solid var(--cyan);
      color: var(--cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(0, 243, 255, 0.55);
      z-index: 50;
      transition: 0.25s;
    }

    .live-voice-btn.active {
      background: var(--emerald);
      border-color: #fff;
      color: #020308;
      box-shadow: 0 0 28px var(--emerald);
      animation: pulseBeacon 0.9s infinite;
    }

    /* Admin Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 3, 8, 0.9);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-box {
      background: #080d1c;
      border: 1px solid var(--danger);
      border-radius: 16px;
      width: 100%;
      max-width: 410px;
      padding: 20px;
      box-shadow: 0 0 38px rgba(255, 0, 76, 0.35);
    }

    .modal-box h3 {
      font-family: 'Orbitron', sans-serif;
      color: var(--cyan);
      font-size: 0.98rem;
      margin-bottom: 14px;
    }

    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 0.76rem;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    .field input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      background: #10172b;
      color: #fff;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }

    .btn-sec {
      background: #1e293b;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-pri {
      background: linear-gradient(135deg, var(--danger), #9333ea);
      color: #fff;
      font-weight: 700;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    @keyframes spinCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes pulseBeacon { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.13); } }
    @keyframes corePulse { from { transform: scale(0.95); } to { transform: scale(1.08); } }
    @keyframes eqDance {
      0% { transform: scaleY(0.35); }
      100% { transform: scaleY(1.45); }
    }
    @keyframes fadeSlide { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <header>
    <div class="brand-box">
      <div class="danger-beacon"></div>
      <div class="brand-title">ZOYA AI RAX</div>
    </div>

    <!-- Real Tactical Chronograph Watch Widget -->
    <div class="chrono-watch">
      <div class="watch-dial">
        <svg viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="18" fill="none" stroke="rgba(0,243,255,0.25)" stroke-width="2" />
          <circle cx="20" cy="20" r="14" fill="none" stroke="rgba(255,0,76,0.45)" stroke-width="1.5" stroke-dasharray="3 3" />
          <g class="watch-sec-ring" id="watchSecHand">
            <line x1="20" y1="20" x2="20" y2="4" stroke="#ff004c" stroke-width="2" stroke-linecap="round" />
            <circle cx="20" cy="4" r="2" fill="#00f3ff" />
          </g>
          <circle cx="20" cy="20" r="2.5" fill="#ffffff" />
        </svg>
      </div>
      <div class="watch-readout">
        <div class="watch-time-row">
          <span class="watch-digits" id="clockTime">00:00:00</span>
          <span class="watch-ampm" id="clockAmPm">PM</span>
        </div>
        <div class="watch-date" id="clockDate">LOADING...</div>
      </div>
    </div>

    <button class="admin-btn" id="openAdminBtn">🔒 ADMIN</button>
  </header>

  <main>
    <!-- Core Visual & Vision Zone -->
    <section class="core-zone">
      <div class="hud-stage" id="hudStage">
        <svg id="zoyaHudSvg" viewBox="0 0 500 260" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="dangerTrace" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.2" />
              <stop offset="50%" stop-color="#00f3ff" stop-opacity="0.95" />
              <stop offset="100%" stop-color="#ff004c" stop-opacity="0.95" />
            </linearGradient>
          </defs>

          <!-- Circuit Traces -->
          <g stroke="url(#dangerTrace)" stroke-width="2" fill="none">
            <path d="M12 42 L78 42 L108 72 L152 72" />
            <circle cx="12" cy="42" r="3.5" fill="#ff004c" />
            <path d="M22 130 L132 130" stroke-width="3" />
            <circle cx="22" cy="130" r="4.5" fill="#00f3ff" />
            <path d="M12 218 L78 218 L108 188 L152 188" />
            <circle cx="12" cy="218" r="3.5" fill="#ff004c" />

            <path d="M488 42 L422 42 L392 72 L348 72" />
            <circle cx="488" cy="42" r="3.5" fill="#ff004c" />
            <path d="M478 130 L368 130" stroke-width="3" />
            <circle cx="478" cy="130" r="4.5" fill="#00f3ff" />
            <path d="M488 218 L422 218 L392 188 L348 188" />
            <circle cx="488" cy="218" r="3.5" fill="#ff004c" />
          </g>

          <!-- Glowing Chevrons >>>> <<<< -->
          <g fill="#ff004c">
            <polygon points="62,118 76,130 62,142 68,142 82,130 68,118" />
            <polygon points="84,118 98,130 84,142 90,142 104,130 90,118" />
            <polygon points="438,118 424,130 438,142 432,142 418,130 432,118" />
            <polygon points="416,118 402,130 416,142 410,142 396,130 410,118" />
          </g>

          <!-- Outer Rotating Reactor Ring -->
          <g class="ring-cw">
            <circle id="outerArc" cx="250" cy="130" r="102" fill="none" stroke="#00f3ff" stroke-width="4.5" stroke-dasharray="52 16 14 16" />
            <circle cx="250" cy="130" r="90" fill="none" stroke="#ff004c" stroke-width="1.5" stroke-dasharray="6 10" />
          </g>

          <!-- Inner Counter-Rotating Tactical Ring -->
          <g class="ring-ccw">
            <circle id="innerArc" cx="250" cy="130" r="76" fill="none" stroke="#ff004c" stroke-width="5.5" stroke-dasharray="34 22" />
            <circle cx="250" cy="130" r="62" fill="none" stroke="#00f3ff" stroke-width="2" stroke-dasharray="16 12" />
          </g>

          <!-- Central Dynamic Core -->
          <circle id="coreShell" cx="250" cy="130" r="48" fill="rgba(0, 243, 255, 0.12)" stroke="#00f3ff" stroke-width="2.5" style="transform-origin: 250px 130px;" />

          <!-- Live Voice / Speech Spectrum Bars inside Core -->
          <g class="core-bars" fill="#00f3ff">
            <rect x="230" y="136" width="5" height="12" rx="2.5" />
            <rect x="239" y="133" width="5" height="18" rx="2.5" />
            <rect x="248" y="131" width="5" height="22" rx="2.5" />

    <!-- Dedicated Live Conversation & Diagnostics Display -->
    <section class="display-zone">
      <div class="display-header">
        <span>ZOYA RAX // LIVE COMMS DISPLAY</span>

      <div class="control-deck">

  <!-- Bottom-Left Continuous Live Voice Chat Button -->
  <button class="live-voice-btn" id="liveVoiceBtn" title="1-Tap Continuous Live Voice Chat">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>
    </svg>
  </button>

  <!-- Admin Login & Keys Modal -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal-box">
      <h3>🔐 ZOYA RAX ADMIN VAULT</h3>

      <div id="loginSection">
        <div class="field">
          <label>Admin Email</label>
          <input type="email" id="adminEmail" placeholder="admin@example.com" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="adminPass" placeholder="••••••••" />
        </div>
        <p id="loginErr" style="color:#ff004c; font-size:0.8rem;"></p>
        <div class="modal-actions">
          <button class="btn-sec" id="closeModal1">Close</button>
          <button class="btn-pri" id="loginBtn">Unlock</button>
        </div>
      </div>

      <div id="keysSection" style="display:none;">
        <div class="field">
          <label>Gemini API Key</label>
          <input type="password" id="geminiKeyInput" placeholder="AIzaSy..." />
        </div>
        <div class="field">
          <label>ElevenLabs API Key (Optional)</label>
          <input type="password" id="elevenKeyInput" placeholder="sk_..." />
        </div>
        <div class="field">
          <label>ElevenLabs Voice ID</label>
          <input type="text" id="elevenVoiceInput" value="21LgWMtK52t5De2eLKAk" />
        </div>
        <p id="saveMsg" style="color:#00ff88; font-size:0.8rem;"></p>
        <div class="modal-actions">
          <button class="btn-sec" id="logoutBtn">Logout</button>
          <button class="btn-sec" id="closeModal2">Close</button>
          <button class="btn-pri" id="saveKeysBtn">Save & Verify</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase & Zoya Intelligence Engine -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, collection, addDoc, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAhc2LqI0tpf4l6dxpFtFuvgDWJXDDT7o8",
      authDomain: "zoya-ai-87957.firebaseapp.com",
      databaseURL: "https://zoya-ai-87957-default-rtdb.firebaseio.com",
      projectId: "zoya-ai-87957",
      storageBucket: "zoya-ai-87957.firebasestorage.app",
      messagingSenderId: "971617756628",
      appId: "1:971617756628:web:a01852aa72e685b3e56241"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let config = {
      geminiKey: "",
      elevenKey: "",
      elevenVoiceId: "21LgWMtK52t5De2eLKAk"
    };

    // Only active supported models (removed deprecated 2.0-flash-lite)
    const MODEL_CANDIDATES = [
      "gemini-2.5-flash",
      "gemini-2.5-flash-lite",
      "gemini-2.0-flash"
    ];
    let activeModel = MODEL_CANDIDATES[0];
    let history = [];
    let isLiveVoice = false;
    let isBusy = false; // True when thinking or speaking
    let recognition = null;
    let camStream = null;
    let facingMode = "user";
    let activeAudio = null;

    const hudStage = document.getElementById("hudStage");
    const statusBadge = document.getElementById("statusBadge");
    const modelBadge = document.getElementById("modelBadge");
    const apiHealthTag = document.getElementById("apiHealthTag");
    const chatStream = document.getElementById("chatStream");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const liveVoiceBtn = document.getElementById("liveVoiceBtn");

    // 1. Real Tactical Chronograph Watch Updater
    function updateChronoWatch() {
      const now = new Date();
      const istString = now.toLocaleTimeString("en-US", {
        timeZone: "Asia/Kolkata",
        hour12: true,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
      const [timePart, ampmPart] = istString.split(" ");
      document.getElementById("clockTime").textContent = timePart;
      document.getElementById("clockAmPm").textContent = ampmPart || "";

      const sec = now.getSeconds();
      document.getElementById("watchSecHand").style.transform = `rotate(${sec * 6}deg)`;

      document.getElementById("clockDate").textContent = now.toLocaleDateString("en-IN", {
        timeZone: "Asia/Kolkata",
        weekday: "short",
        day: "2-digit",
        month: "long",
        year: "numeric"
      }).toUpperCase();
    }
    setInterval(updateChronoWatch, 1000);
    updateChronoWatch();

    // 2. Display Stream Helper
    function addLog(type, text) {
      const div = document.createElement("div");
      if (type === "alert") {
        div.className = "msg system-alert";
        div.textContent = "⚠️ " + text;
      } else {
        div.className = `msg ${type}`;
        const tag = document.createElement("span");
        tag.className = "msg-tag";
        tag.textContent = type === "user" ? "REZA // TRANSMIT" : `ZOYA RAX // ${activeModel.toUpperCase()}`;
        div.appendChild(tag);
        div.appendChild(document.createTextNode(text));
      }
      chatStream.appendChild(div);
      chatStream.scrollTop = chatStream.scrollHeight;
    }

    // 3. Auto-Verify Gemini API Key & Detect Working Model
    async function verifyGeminiKey() {
      if (!config.geminiKey) {
        modelBadge.textContent = "MODEL: KEY MISSING";
        modelBadge.className = "badge error-badge";
        apiHealthTag.textContent = "API: LOCKED";
        addLog("alert", "Gemini API key set nahi hai. Upar 🔒 ADMIN button par click karke key save karein.");
        return;
      }

      modelBadge.textContent = "MODEL: SCANNING...";
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${config.geminiKey}`);
        const data = await res.json();
        if (!res.ok) {
          const errMsg = data?.error?.message || "Invalid API Key";
          modelBadge.textContent = "MODEL: KEY ERROR";
          modelBadge.className = "badge error-badge";
          apiHealthTag.textContent = "API: ERROR";
          addLog("alert", `Gemini API Error: ${errMsg}`);
          return;
        }

        const available = (data.models || []).map(m => m.name.replace("models/", ""));
        const matched = MODEL_CANDIDATES.find(c => available.includes(c)) || available.find(m => m.includes("2.5-flash")) || MODEL_CANDIDATES[0];
        activeModel = matched;
        modelBadge.textContent = `ACTIVE: ${activeModel.toUpperCase()}`;
        modelBadge.className = "badge model-badge";
        apiHealthTag.textContent = "API: ONLINE ✔";
      } catch (_) {
        modelBadge.textContent = "MODEL: OFFLINE";
        modelBadge.className = "badge error-badge";
        addLog("alert", "Network error: Gemini server se connect nahi ho paaya.");
      }
    }

    async function loadConfig() {
      try {
        const snap = await getDoc(doc(db, "zoya_config", "api_keys"));
        if (snap.exists()) {
          config = { ...config, ...snap.data() };
          document.getElementById("geminiKeyInput").value = config.geminiKey || "";
          document.getElementById("elevenKeyInput").value = config.elevenKey || "";
          document.getElementById("elevenVoiceInput").value = config.elevenVoiceId || "21LgWMtK52t5De2eLKAk";
        }
      } catch (e) {
        addLog("alert", "Firebase Config Read Error: " + e.message);
      }
      await verifyGeminiKey();
    }

    async function loadMemory() {
      try {
        const q = query(collection(db, "zoya_memory"), orderBy("timestamp", "desc"), limit(12));
        const snap = await getDocs(q);
        const list = [];
        snap.forEach(d => list.push(d.data()));
        list.reverse();

        if (list.length === 0) {
          addLog("zoya", "Zoya AI Rax tactical core active hai Reza. Niche mic par ek baar tap karke live baat shuru karein!");
        } else {
          list.forEach(m => {
            addLog(m.role, m.text);
            history.push({
              role: m.role === "user" ? "user" : "model",
              parts: [{ text: m.text }]
            });
          });
        }
      } catch (_) {}
    }

    async function saveMemory(role, text) {
      try {
        await addDoc(collection(db, "zoya_memory"), { role, text, timestamp: Date.now() });
      } catch (_) {}
    }

    // 4. Visual State Controller
    function setCoreState(state) {
      hudStage.classList.remove("listening", "speaking");
      statusBadge.className = "badge";

      if (state === "listening") {
        hudStage.classList.add("listening");
        statusBadge.classList.add("listening-badge");
        statusBadge.textContent = "🎙️ LISTENING TO REZA...";
      } else if (state === "speaking") {
        hudStage.classList.add("speaking");
        statusBadge.classList.add("speaking-badge");
        statusBadge.textContent = "🔊 ZOYA SPEAKING...";
      } else if (state === "thinking") {
        statusBadge.textContent = "⚡ ZOYA THINKING...";
      } else {
        statusBadge.textContent = camStream ? "📷 VISION: CAMERA LIVE" : "CORE: STANDBY";
      }
    }

    // 5. Camera Vision Engine
    const cameraWrapper = document.getElementById("cameraWrapper");
    const cameraFeed = document.getElementById("cameraFeed");
    const camToggleBtn = document.getElementById("camToggleBtn");

    async function startCamera() {
      stopCamera();
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        addLog("alert", "Camera access ke liye website ko HTTPS ya Chrome mein kholein.");
        return;
      }
      try {
        camStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: facingMode } },
          audio: false
        });
        cameraFeed.srcObject = camStream;
        await cameraFeed.play();
        hudStage.style.display = "none";
        cameraWrapper.classList.add("active");
        camToggleBtn.classList.add("active");
        setCoreState("idle");
      } catch (e) {
        addLog("alert", "Camera Error: " + (e.message || "Permission denied."));
      }
    }

    function stopCamera() {
      if (camStream) {
        camStream.getTracks().forEach(t => t.stop());
        camStream = null;
      }
      cameraFeed.srcObject = null;
      cameraWrapper.classList.remove("active");
      camToggleBtn.classList.remove("active");
      hudStage.style.display = "flex";
      setCoreState(isLiveVoice ? "listening" : "idle");
    }

    function captureFrameBase64() {
      if (!camStream || !cameraFeed.videoWidth) return null;
      const canvas = document.createElement("canvas");
      canvas.width = 480;
      canvas.height = Math.round((cameraFeed.videoHeight / cameraFeed.videoWidth) * 480);
      canvas.getContext("2d").drawImage(cameraFeed, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL("image/jpeg", 0.78).split(",")[1];
    }

    camToggleBtn.addEventListener("click", () => {
      if (camStream) stopCamera();
      else startCamera();
    });

    document.getElementById("closeCamBtn").addEventListener("click", stopCamera);
    document.getElementById("flipCamBtn").addEventListener("click", () => {
      facingMode = facingMode === "user" ? "environment" : "user";
      startCamera();
    });
    document.getElementById("scanNowBtn").addEventListener("click", () => {
      sendPrompt("Dekho Zoya camera mein main kaisa lag raha hoon, kya pehna hai aur kya kar raha hoon?");
    });

    // 6. Resume Continuous Mic Helper
    function resumeLiveListening() {
      isBusy = false;
      if (isLiveVoice && recognition) {
        setCoreState("listening");
        try {
          recognition.start();
        } catch (_) {}
      } else {
        setCoreState("idle");
      }
    }

    // 7. Voice Output (ElevenLabs + Browser Fallback)
    async function speak(text) {
      isBusy = true;
      if (recognition) {
        try { recognition.abort(); } catch (_) {}
      }
      setCoreState("speaking");

      if (config.elevenKey) {
        try {
          const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${config.elevenVoiceId}`, {
            method: "POST",
            headers: { "xi-api-key": config.elevenKey, "Content-Type": "application/json" },
            body: JSON.stringify({
              text,
              model_id: "eleven_multilingual_v2",
              voice_settings: { stability: 0.5, similarity_boost: 0.78 }
            })
          });
          if (res.ok) {
            const audioUrl = URL.createObjectURL(await res.blob());
            activeAudio = new Audio(audioUrl);
            activeAudio.onended = () => {
              activeAudio = null;
              resumeLiveListening();
            };
            activeAudio.onerror = () => {
              activeAudio = null;
              resumeLiveListening();
            };
            await activeAudio.play();
            return;
          }
        } catch (_) {}
      }

      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "hi-IN";
        u.rate = 1.05;
        u.onend = () => resumeLiveListening();
        u.onerror = () => resumeLiveListening();
        window.speechSynthesis.speak(u);
      } else {
        setTimeout(resumeLiveListening, 1000);
      }
    }

    // 8. Auto-Fallback Gemini Request Engine
    async function sendPrompt(text) {
      if (!text || !text.trim()) return;
      isBusy = true;
      if (recognition) {
        try { recognition.abort(); } catch (_) {}
      }

      const frameBase64 = captureFrameBase64();
      addLog("user", frameBase64 ? `📷 ${text}` : text);
      userInput.value = "";
      saveMemory("user", text);

      if (!config.geminiKey) {
        addLog("alert", "Gemini API key missing! Upar 🔒 ADMIN button se key save karein.");
        resumeLiveListening();
        return;
      }

      setCoreState("thinking");
      const nowIST = new Date().toLocaleString("en-IN", { timeZone: "Asia/Kolkata" });
      const sysPrompt = `Tum ZOYA AI RAX ho—Reza Ahmad (Abrar Bhai) ki high-tech, sharp aur caring AI companion.
      - Natural Hinglish/Hindi mein crisp, short aur friendly jawab do taaki voice chat fast chale.
      - Agar user ki camera image attach hai, toh unke kapde, look, expression aur aas-paas ki cheezon ko accurately observe karke jawab do.
      - Current IST Time: ${nowIST}.`;

      const userParts = [{ text }];
      if (frameBase64) {
        userParts.push({ inline_data: { mime_type: "image/jpeg", data: frameBase64 } });
      }
      history.push({ role: "user", parts: userParts });

      const tryOrder = [activeModel, ...MODEL_CANDIDATES.filter(m => m !== activeModel)];
      let lastError = "";

      for (const modelName of tryOrder) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${config.geminiKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              system_instruction: { parts: [{ text: sysPrompt }] },
              contents: history.slice(-8)
            })
          });
          const data = await res.json();

          if (res.ok && data?.candidates?.[0]?.content?.parts?.[0]?.text) {
            activeModel = modelName;
            modelBadge.textContent = `ACTIVE: ${activeModel.toUpperCase()}`;
            modelBadge.className = "badge model-badge";
            apiHealthTag.textContent = "API: ONLINE ✔";

            const reply = data.candidates[0].content.parts[0].text;
            history.push({ role: "model", parts: [{ text: reply }] });
            addLog("zoya", reply);
            saveMemory("zoya", reply);
            await speak(reply);
            return;
          } else {
            lastError = data?.error?.message || `HTTP ${res.status}`;
          }
        } catch (err) {
          lastError = err.message;
        }
      }

      modelBadge.textContent = "MODEL: FAILED";
      modelBadge.className = "badge error-badge";
      apiHealthTag.textContent = "API: ERROR ✖";
      addLog("alert", `Gemini API Failed (${lastError}). Admin panel mein apni API key check karein.`);
      resumeLiveListening();
    }

    // 9. 1-Tap Continuous Live Voice Chat Engine (Fixed 5-sec Cutoff)
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRec) {
      recognition = new SpeechRec();
      recognition.lang = "hi-IN";
      recognition.interimResults = false;
      recognition.continuous = true; // Continuous mode ON so it doesn't cut every 3-5 seconds

      recognition.onstart = () => {
        if (!isBusy && isLiveVoice) setCoreState("listening");
      };

      recognition.onresult = (e) => {
        const lastIdx = e.results.length - 1;
        if (!e.results[lastIdx].isFinal) return;
        const transcript = e.results[lastIdx][0].transcript.trim();
        if (transcript && !isBusy) {
          sendPrompt(transcript);
        }
      };

      recognition.onerror = (e) => {
        if (e.error === "not-allowed") {
          isLiveVoice = false;
          isBusy = false;
          liveVoiceBtn.classList.remove("active");
          setCoreState("idle");
          addLog("alert", "Mic permission blocked hai. Browser settings mein Microphone allow karein.");
        }
      };

      // Auto-restart silently if browser drops connection due to long silence
      recognition.onend = () => {
        if (isLiveVoice && !isBusy) {
          setTimeout(() => {
            if (isLiveVoice && !isBusy) {
              try { recognition.start(); } catch (_) {}
            }
          }, 150);
        }
      };
    }

    liveVoiceBtn.addEventListener("click", () => {
      if (!recognition) {
        addLog("alert", "Is browser mein Live Voice supported nahi hai. Google Chrome use karein.");
        return;
      }

      // Unlock mobile audio context on user tap so Zoya's voice never gets blocked
      if ("speechSynthesis" in window) {
        const unlock = new SpeechSynthesisUtterance("");
        window.speechSynthesis.speak(unlock);
      }

      isLiveVoice = !isLiveVoice;
      liveVoiceBtn.classList.toggle("active", isLiveVoice);

      if (isLiveVoice) {
        isBusy = false;
        setCoreState("listening");
        try { recognition.start(); } catch (_) {}
      } else {
        isBusy = false;
        if (activeAudio) {
          activeAudio.pause();
          activeAudio = null;
        }
        if ("speechSynthesis" in window) window.speechSynthesis.cancel();
        setCoreState("idle");
        try { recognition.abort(); } catch (_) {}
      }
    });

    sendBtn.addEventListener("click", () => sendPrompt(userInput.value));
    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendPrompt(userInput.value);
    });

    // 10. Admin Modal Controls
    const adminModal = document.getElementById("adminModal");
    const loginSection = document.getElementById("loginSection");
    const keysSection = document.getElementById("keysSection");

    document.getElementById("openAdminBtn").addEventListener("click", () => adminModal.style.display = "flex");
    document.getElementById("closeModal1").addEventListener("click", () => adminModal.style.display = "none");
    document.getElementById("closeModal2").addEventListener("click", () => adminModal.style.display = "none");

    onAuthStateChanged(auth, (user) => {
      loginSection.style.display = user ? "none" : "block";
      keysSection.style.display = user ? "block" : "none";
    });

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("adminEmail").value.trim();
      const pass = document.getElementById("adminPass").value;
      const errEl = document.getElementById("loginErr");
      errEl.textContent = "";
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (_) {
        errEl.textContent = "Login failed: Email ya password galat hai.";
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => signOut(auth));

    document.getElementById("saveKeysBtn").addEventListener("click", async () => {
      const geminiKey = document.getElementById("geminiKeyInput").value.trim();
      const elevenKey = document.getElementById("elevenKeyInput").value.trim();
      const elevenVoiceId = document.getElementById("elevenVoiceInput").value.trim() || "21LgWMtK52t5De2eLKAk";
      const msgEl = document.getElementById("saveMsg");

      try {
        await setDoc(doc(db, "zoya_config", "api_keys"), { geminiKey, elevenKey, elevenVoiceId });
        config = { geminiKey, elevenKey, elevenVoiceId };
        msgEl.style.color = "#00ff88";
        msgEl.textContent = "✅ Keys saved! Model verify ho raha hai...";
        await verifyGeminiKey();
      } catch (e) {
        msgEl.style.color = "#ff004c";
        msgEl.textContent = "Error: " + e.message;
      }
    });

    await loadConfig();
    await loadMemory();
  </script>
