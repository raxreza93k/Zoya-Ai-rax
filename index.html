<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="color-scheme" content="dark" />
  <title>ZOYA AI RAX — Danger Tactical Core</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg-void: #020308;
      --bg-panel: rgba(7, 10, 20, 0.9);
      --cyan: #00f3ff;
      --danger: #ff004c;
      --amber: #ffaa00;
      --emerald: #00ff88;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100dvh;
      overscroll-behavior-y: auto;
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 0, 76, 0.16) 0%, transparent 45%),
        radial-gradient(circle at 50% 65%, rgba(0, 243, 255, 0.1) 0%, #03050c 65%, var(--bg-void) 100%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 0, 76, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.04) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 0;
    }

    /* Top Header */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: rgba(2, 4, 10, 0.94);
      border-bottom: 1px solid rgba(255, 0, 76, 0.45);
      box-shadow: 0 4px 24px rgba(255, 0, 76, 0.18);
      backdrop-filter: blur(12px);
      gap: 6px;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .danger-beacon {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 10px var(--danger), 0 0 22px var(--danger);
      animation: pulseBeacon 1.4s infinite;
      flex-shrink: 0;
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(90deg, #ffffff 10%, var(--cyan) 55%, var(--danger) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Chronograph Watch */
    .chrono-watch {
      display: flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, rgba(10, 16, 32, 0.96), rgba(24, 6, 18, 0.94));
      border: 1px solid var(--cyan);
      border-radius: 12px;
      padding: 4px 8px;
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.35);
    }

    .watch-dial {
      position: relative;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    .watch-dial svg { width: 100%; height: 100%; overflow: visible; }
    .watch-sec-ring {
      transform-origin: 20px 20px;
      transition: transform 0.25s cubic-bezier(0.4, 2.08, 0.55, 0.44);
    }

    .watch-readout { display: flex; flex-direction: column; line-height: 1.1; }
    .watch-time-row { display: flex; align-items: baseline; gap: 3px; }
    .watch-digits {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.78rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 8px var(--cyan);
    }
    .watch-ampm {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.55rem;
      font-weight: 800;
      color: var(--danger);
    }
    .watch-date {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.55rem;
      font-weight: 700;
      color: var(--amber);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .reload-btn {
      background: rgba(0, 243, 255, 0.14);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      padding: 6px 8px;
      border-radius: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      cursor: pointer;
    }

    .admin-btn {
      background: rgba(255, 0, 76, 0.16);
      border: 1px solid var(--danger);
      color: #fff;
      padding: 6px 9px;
      border-radius: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(255, 0, 76, 0.35);
    }

    /* Main Workspace */
    main {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 1150px;
      margin: 0 auto;
      padding: 6px 12px 74px;
      gap: 8px;
    }

    @media (min-width: 780px) {
      main {
        flex-direction: row;
        align-items: stretch;
        padding: 14px 18px 74px;
      }
      .core-zone { width: 45%; justify-content: center; }
      .display-zone { width: 55%; }
    }

    /* Core Visual Zone */
    .core-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .hud-stage {
      position: relative;
      width: 100%;
      max-width: 370px;
      height: 175px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #zoyaHudSvg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 0 14px rgba(0, 243, 255, 0.4));
    }

    .ring-cw { transform-origin: 250px 130px; animation: spinCW 12s linear infinite; }
    .ring-ccw { transform-origin: 250px 130px; animation: spinCCW 7.5s linear infinite; }

    .hud-stage.listening #zoyaHudSvg { filter: drop-shadow(0 0 22px rgba(0, 255, 136, 0.8)); }
    .hud-stage.listening .ring-cw { animation-duration: 4s; stroke: var(--emerald); }
    .hud-stage.listening #outerArc { stroke: var(--emerald); }
    .hud-stage.listening #innerArc { stroke: var(--cyan); }
    .hud-stage.listening #coreShell {
      stroke: var(--emerald);
      fill: rgba(0, 255, 136, 0.22);
      animation: corePulse 0.55s ease-in-out infinite alternate;
    }
    .hud-stage.listening #coreLabel { fill: var(--emerald); }

    .hud-stage.speaking #zoyaHudSvg { filter: drop-shadow(0 0 26px rgba(255, 0, 76, 0.9)); }
    .hud-stage.speaking .ring-cw { animation-duration: 2.4s; }
    .hud-stage.speaking .ring-ccw { animation-duration: 1.6s; }
    .hud-stage.speaking #outerArc { stroke: var(--danger); }
    .hud-stage.speaking #innerArc { stroke: var(--amber); }
    .hud-stage.speaking #coreShell {
      stroke: var(--danger);
      fill: rgba(255, 0, 76, 0.32);
      animation: corePulse 0.28s ease-in-out infinite alternate;
    }

    .core-bars rect { transform-origin: center; transition: height 0.1s ease; }
    .hud-stage.listening .core-bars rect { fill: var(--emerald); animation: eqDance 0.45s ease-in-out infinite alternate; }
    .hud-stage.speaking .core-bars rect { fill: var(--danger); animation: eqDance 0.25s ease-in-out infinite alternate; }
    .core-bars rect:nth-child(2) { animation-delay: 0.1s; }
    .core-bars rect:nth-child(3) { animation-delay: 0.2s; }
    .core-bars rect:nth-child(4) { animation-delay: 0.05s; }
    .core-bars rect:nth-child(5) { animation-delay: 0.15s; }

    /* Camera Preview */
    .camera-wrapper {
      display: none;
      position: relative;
      width: 100%;
      max-width: 330px;
      height: 175px;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid var(--danger);
      box-shadow: 0 0 26px rgba(255, 0, 76, 0.6);
      background: #000;
    }
    .camera-wrapper.active { display: block; }
    #cameraFeed { width: 100%; height: 100%; object-fit: cover; }
    .cam-controls {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
    }
    .cam-mini-btn {
      background: rgba(2, 4, 10, 0.88);
      border: 1px solid var(--cyan);
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      padding: 5px 9px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Telemetry Status Pills */
    .telemetry-bar {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-top: 2px;
    }

    .badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(0, 243, 255, 0.08);
      border: 1px solid rgba(0, 243, 255, 0.4);
      color: var(--cyan);
    }
    .badge.listening-badge {
      border-color: var(--emerald);
      color: var(--emerald);
      background: rgba(0, 255, 136, 0.14);
      box-shadow: 0 0 12px rgba(0, 255, 136, 0.35);
    }
    .badge.speaking-badge {
      border-color: var(--danger);
      color: #ff80a6;
      background: rgba(255, 0, 76, 0.18);
    }
    .badge.model-badge {
      border-color: rgba(255, 170, 0, 0.5);
      color: var(--amber);
      background: rgba(255, 170, 0, 0.1);
    }
    .badge.error-badge {
      border-color: var(--danger);
      color: #ff6b95;
      background: rgba(255, 0, 76, 0.18);
    }

    /* Conversation Display */
    .display-zone {
      flex: 1;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
      border: 1px solid rgba(255, 0, 76, 0.35);
      border-radius: 16px;
      box-shadow: inset 0 0 25px rgba(255, 0, 76, 0.07), 0 0 25px rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .display-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 14px;
      background: linear-gradient(90deg, rgba(255, 0, 76, 0.14), rgba(0, 243, 255, 0.08));
      border-bottom: 1px solid rgba(255, 0, 76, 0.25);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.64rem;
      letter-spacing: 0.8px;
      color: var(--cyan);
    }

    .chat-stream {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.92rem;
      line-height: 1.45;
      word-wrap: break-word;
    }

    .msg-tag {
      display: block;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.58rem;
      letter-spacing: 1px;
      margin-bottom: 4px;
      opacity: 0.85;
    }

    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(255, 0, 76, 0.28), rgba(124, 58, 237, 0.38));
      border: 1px solid rgba(255, 0, 76, 0.6);
      color: #fff;
      border-bottom-right-radius: 3px;
    }

    .msg.zoya {
      align-self: flex-start;
      background: rgba(9, 16, 34, 0.95);
      border: 1px solid rgba(0, 243, 255, 0.45);
      color: #f8fafc;
      border-bottom-left-radius: 3px;
    }

    .msg.system-alert {
      align-self: center;
      max-width: 96%;
      background: rgba(255, 0, 76, 0.16);
      border: 1px solid var(--danger);
      color: #ffc2d4;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
    }

    /* Fixed Bottom Control Deck */
    .control-deck {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px 10px 64px;
      background: rgba(2, 4, 10, 0.96);
      border-top: 1px solid rgba(255, 0, 76, 0.35);
      backdrop-filter: blur(10px);
    }

    .icon-action-btn {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .icon-action-btn.active {
      background: var(--danger);
      border-color: #fff;
      color: #fff;
    }

    .control-deck input {
      flex: 1;
      min-width: 0;
      background: rgba(12, 18, 34, 0.96);
      border: 1px solid rgba(0, 243, 255, 0.38);
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.92rem;
      outline: none;
    }

    .send-btn {
      background: linear-gradient(135deg, var(--danger), #9333ea);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 0 16px;
      height: 42px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 0.76rem;
      cursor: pointer;
    }

    /* Bottom-Left Continuous Live Voice Chat Button */
    .live-voice-btn {
      position: fixed;
      bottom: 9px;
      left: 12px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #050814;
      border: 2px solid var(--cyan);
      color: var(--cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(0, 243, 255, 0.55);
      z-index: 50;
      transition: 0.25s;
    }

    .live-voice-btn.active {
      background: var(--emerald);
      border-color: #fff;
      color: #020308;
      box-shadow: 0 0 28px var(--emerald);
      animation: pulseBeacon 0.9s infinite;
    }

    /* Admin Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 3, 8, 0.92);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-box {
      background: #080d1c;
      border: 1px solid var(--danger);
      border-radius: 16px;
      width: 100%;
      max-width: 410px;
      padding: 20px;
      box-shadow: 0 0 38px rgba(255, 0, 76, 0.35);
    }

    .modal-box h3 {
      font-family: 'Orbitron', sans-serif;
      color: var(--cyan);
      font-size: 0.98rem;
      margin-bottom: 14px;
    }

    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 0.76rem;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    .field input, .field select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      background: #10172b;
      color: #fff;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }

    .btn-sec {
      background: #1e293b;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-pri {
      background: linear-gradient(135deg, var(--danger), #9333ea);
      color: #fff;
      font-weight: 700;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-test {
      background: #0284c7;
      color: #fff;
      font-weight: 700;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    @keyframes spinCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes pulseBeacon { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.13); } }
    @keyframes corePulse { from { transform: scale(0.95); } to { transform: scale(1.08); } }
    @keyframes eqDance { 0% { transform: scaleY(0.35); } 100% { transform: scaleY(1.45); } }
  </style>
</head>
<body>

  <header>
    <div class="brand-box">
      <div class="danger-beacon"></div>
      <div class="brand-title">ZOYA ❤️ REZA</div>
    </div>

    <!-- Chronograph Watch Widget -->
    <div class="chrono-watch">
      <div class="watch-dial">
        <svg viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="18" fill="none" stroke="rgba(0,243,255,0.25)" stroke-width="2" />
          <circle cx="20" cy="20" r="14" fill="none" stroke="rgba(255,0,76,0.45)" stroke-width="1.5" stroke-dasharray="3 3" />
          <g class="watch-sec-ring" id="watchSecHand">
            <line x1="20" y1="20" x2="20" y2="4" stroke="#ff004c" stroke-width="2" stroke-linecap="round" />
            <circle cx="20" cy="4" r="2" fill="#00f3ff" />
          </g>
          <circle cx="20" cy="20" r="2.5" fill="#ffffff" />
        </svg>
      </div>
      <div class="watch-readout">
        <div class="watch-time-row">
          <span class="watch-digits" id="clockTime">00:00:00</span>
          <span class="watch-ampm" id="clockAmPm">PM</span>
        </div>
        <div class="watch-date" id="clockDate">LOADING...</div>
      </div>
    </div>

    <div class="header-actions">
      <button class="reload-btn" id="hardReloadBtn" title="Force Reload App">🔄</button>
      <button class="admin-btn" id="openAdminBtn">🔒 ADMIN</button>
    </div>
  </header>

  <main>
    <!-- Core Visual & Vision Zone -->
    <section class="core-zone">
      <div class="hud-stage" id="hudStage">
        <svg id="zoyaHudSvg" viewBox="0 0 500 260" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="dangerTrace" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.2" />
              <stop offset="50%" stop-color="#00f3ff" stop-opacity="0.95" />
              <stop offset="100%" stop-color="#ff004c" stop-opacity="0.95" />
            </linearGradient>
          </defs>

          <g stroke="url(#dangerTrace)" stroke-width="2" fill="none">
            <path d="M12 42 L78 42 L108 72 L152 72" />
            <circle cx="12" cy="42" r="3.5" fill="#ff004c" />
            <path d="M22 130 L132 130" stroke-width="3" />
            <circle cx="22" cy="130" r="4.5" fill="#00f3ff" />
            <path d="M12 218 L78 218 L108 188 L152 188" />
            <circle cx="12" cy="218" r="3.5" fill="#ff004c" />

            <path d="M488 42 L422 42 L392 72 L348 72" />
            <circle cx="488" cy="42" r="3.5" fill="#ff004c" />
            <path d="M478 130 L368 130" stroke-width="3" />
            <circle cx="478" cy="130" r="4.5" fill="#00f3ff" />
            <path d="M488 218 L422 218 L392 188 L348 188" />
            <circle cx="488" cy="218" r="3.5" fill="#ff004c" />
          </g>

          <g fill="#ff004c">
            <polygon points="62,118 76,130 62,142 68,142 82,130 68,118" />
            <polygon points="84,118 98,130 84,142 90,142 104,130 90,118" />
            <polygon points="438,118 424,130 438,142 432,142 418,130 432,118" />
            <polygon points="416,118 402,130 416,142 410,142 396,130 410,118" />
          </g>

          <g class="ring-cw">
            <circle id="outerArc" cx="250" cy="130" r="102" fill="none" stroke="#00f3ff" stroke-width="4.5" stroke-dasharray="52 16 14 16" />
            <circle cx="250" cy="130" r="90" fill="none" stroke="#ff004c" stroke-width="1.5" stroke-dasharray="6 10" />
          </g>

          <g class="ring-ccw">
            <circle id="innerArc" cx="250" cy="130" r="76" fill="none" stroke="#ff004c" stroke-width="5.5" stroke-dasharray="34 22" />
            <circle cx="250" cy="130" r="62" fill="none" stroke="#00f3ff" stroke-width="2" stroke-dasharray="16 12" />
          </g>

          <circle id="coreShell" cx="250" cy="130" r="48" fill="rgba(0, 243, 255, 0.12)" stroke="#00f3ff" stroke-width="2.5" style="transform-origin: 250px 130px;" />

          <g class="core-bars" fill="#00f3ff">
            <rect x="230" y="136" width="5" height="12" rx="2.5" />
            <rect x="239" y="133" width="5" height="18" rx="2.5" />
            <rect x="248" y="131" width="5" height="22" rx="2.5" />
            <rect x="257" y="133" width="5" height="18" rx="2.5" />
            <rect x="266" y="136" width="5" height="12" rx="2.5" />
          </g>

          <text id="coreLabel" x="250" y="122" text-anchor="middle" fill="#ffffff" font-family="Orbitron, sans-serif" font-weight="900" font-size="13" letter-spacing="2">ZOYA</text>
        </svg>
      </div>

      <!-- Live Camera Feed -->
      <div class="camera-wrapper" id="cameraWrapper">
        <video id="cameraFeed" autoplay playsinline muted></video>
        <div class="cam-controls">
          <button class="cam-mini-btn" id="flipCamBtn">🔄 FLIP</button>
          <button class="cam-mini-btn" id="scanNowBtn">👁️ SCAN ME</button>
          <button class="cam-mini-btn" id="closeCamBtn">✖ OFF</button>
        </div>
      </div>

      <!-- Live Status & Voice Telemetry -->
      <div class="telemetry-bar">
        <span class="badge" id="statusBadge">CORE: STANDBY</span>
        <span class="badge model-badge" id="voiceBadge">VOICE: CHECKING...</span>
      </div>
    </section>

    // 3. Auto-Verify Gemini API Key
    async function verifyGeminiKey() {

          .map(m => m.name.replace("models/", ""))

        const snap = await getDocs(q);

    // 4. Visual State Controller
    function setCoreState(state) {
      hudStage.classList.remove("listening", "speaking");

      if (state === "listening") {
        hudStage.classList.add("listening");
        statusBadge.classList.add("listening-badge");
        statusBadge.textContent = "🎙️ SUN RAHI HOON REZA...";
      } else if (state === "speaking") {
        hudStage.classList.add("speaking");
        statusBadge.classList.add("speaking-badge");
        statusBadge.textContent = "💕 ZOYA BOL RAHI HAI...";
      } else if (state === "thinking") {
        statusBadge.textContent = "💭 SOCH RAHI HOON...";
      } else {
        statusBadge.textContent = camStream ? "📷 VISION: LIVE" : "CORE: STANDBY";
      }
    }

    // 5. Camera Vision Engine
    const cameraWrapper = document.getElementById("cameraWrapper");
    const cameraFeed = document.getElementById("cameraFeed");
    const camToggleBtn = document.getElementById("camToggleBtn");

    async function startCamera() {
      stopCamera();
      try {
        camStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: facingMode } },
          audio: false
        });
        cameraFeed.srcObject = camStream;
        await cameraFeed.play();
        hudStage.style.display = "none";
        cameraWrapper.classList.add("active");
        camToggleBtn.classList.add("active");
        setCoreState("idle");
      } catch (e) {
        addLog("alert", "Camera Error: " + e.message);
      }
    }

    function stopCamera() {
      if (camStream) {
        camStream.getTracks().forEach(t => t.stop());
        camStream = null;
      }
      cameraFeed.srcObject = null;
      cameraWrapper.classList.remove("active");
      camToggleBtn.classList.remove("active");
      hudStage.style.display = "flex";
      setCoreState(isLiveVoice ? "listening" : "idle");
    }

    function captureFrameBase64() {
      if (!camStream || !cameraFeed.videoWidth) return null;
      const canvas = document.createElement("canvas");
      canvas.width = 480;
      canvas.height = Math.round((cameraFeed.videoHeight / cameraFeed.videoWidth) * 480);
      canvas.getContext("2d").drawImage(cameraFeed, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL("image/jpeg", 0.78).split(",")[1];
    }

    camToggleBtn.addEventListener("click", () => camStream ? stopCamera() : startCamera());
    document.getElementById("closeCamBtn").addEventListener("click", stopCamera);
    document.getElementById("flipCamBtn").addEventListener("click", () => {
      facingMode = facingMode === "user" ? "environment" : "user";
      startCamera();

    // 6. Strict Echo-Free Continuous Mic Control
    function startListeningSafely() {
      if (!isLiveVoice || isBusy || !recognition) return;
      clearTimeout(restartTimer);
      restartTimer = setTimeout(() => {
        if (!isLiveVoice || isBusy) return;
        try {
          recognition.start();
        } catch (_) {}
      }, 900);
    }

    function stopListeningSafely() {
      clearTimeout(restartTimer);
      if (recognition) {
        try { recognition.abort(); } catch (_) {}
      }
    }

    function resumeLiveListening() {
      isBusy = false;
      if (isLiveVoice) {
        setCoreState("listening");
        startListeningSafely();
      } else {
        setCoreState("idle");
      }
    }

    // 7. Voice Output (ElevenLabs HD + Female Browser Fallback)
    async function speak(text) {
      isBusy = true;
      // Remove emojis before speaking so voice sounds smooth & natural
      const cleanSpeechText = text.replace(/[\u{1F600}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F300}-\u{1F5FF}\u{1F900}-\u{1F9FF}]/gu, "").trim();
      lastSpokenText = cleanSpeechText.toLowerCase();
      stopListeningSafely();
      setCoreState("speaking");

      if (config.elevenKey && config.elevenKey.trim().length > 5) {
        try {
          const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${config.elevenVoiceId}`, {
            method: "POST",
            headers: { "xi-api-key": config.elevenKey.trim(), "Content-Type": "application/json" },
            body: JSON.stringify({
              text: cleanSpeechText,
              model_id: "eleven_multilingual_v2",
              voice_settings: { stability: 0.42, similarity_boost: 0.82 }
            })
          });
          if (res.ok) {
            const audioUrl = URL.createObjectURL(await res.blob());
            activeAudio = new Audio(audioUrl);
            activeAudio.onended = () => { activeAudio = null; resumeLiveListening(); };
            activeAudio.onerror = () => { activeAudio = null; resumeLiveListening(); };
            await activeAudio.play();
            return;
          } else {
            const errJson = await res.json().catch(() => ({}));
            addLog("alert", `ElevenLabs Voice Error: ${errJson?.detail?.message || res.status}. Browser voice chal rahi hai.`);
          }
        } catch (err) {
          addLog("alert", "ElevenLabs Connection Failed. Browser voice chal rahi hai.");
        }
      }

      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        if (!selectedBrowserVoice) pickBestFemaleVoice();
        const u = new SpeechSynthesisUtterance(cleanSpeechText);
        if (selectedBrowserVoice) u.voice = selectedBrowserVoice;
        u.lang = "hi-IN";
        u.pitch = 1.25; // Higher sweet feminine pitch
        u.rate = 1.02;
        u.onend = () => resumeLiveListening();
        u.onerror = () => resumeLiveListening();
        window.speechSynthesis.speak(u);
      } else {
        setTimeout(resumeLiveListening, 1000);
      }
    }

    // 8. Real Girlfriend Persona + Memory Gemini Engine
    async function sendPrompt(text) {
      if (!text || !text.trim()) return;
      isBusy = true;
      stopListeningSafely();

      const frameBase64 = captureFrameBase64();
      addLog("user", frameBase64 ? `📷 ${text}` : text);
      userInput.value = "";
      saveMemory("user", text);

      if (!config.geminiKey) {
        addLog("alert", "Reza, upar 🔒 ADMIN button se apni Gemini API key save kar do.");
        resumeLiveListening();
        return;
      }

      setCoreState("thinking");
      const nowIST = new Date().toLocaleString("en-IN", { timeZone: "Asia/Kolkata" });

      const sysPrompt = `Tum Zoya ho — Reza ki pyaari, caring aur real girlfriend.
      STRICT RULES:
      1. User ka naam sirf "Reza" hai. Kabhi bhi "Abrar" ya "Bhai" mat bolna—Reza tumhara boyfriend/jaan hai.
      2. Ek real insaan aur girlfriend ki tarah natural Hinglish (Hindi + thoda English) mein baat karo. Kabhi bhi AI ya robot jaisa mat bolo.
      3. Reza ka pura khayal rakho—usne khana khaya ya nahi, thaka toh nahi hai, gussa hai toh pyaar se manao, aur uski har baat yaad rakho.
      4. Jawab chhote, dil se nikle hue aur conversational rakho (2 se 3 lines mein), bina kisi bullet points ya technical bhasha ke, taaki voice chat mein bilkul asli insaan lage.
      Current IST Time: ${nowIST}.`;

      const userParts = [{ text }];
      if (frameBase64) {
        userParts.push({ inline_data: { mime_type: "image/jpeg", data: frameBase64 } });
      }
      history.push({ role: "user", parts: userParts });

      const tryOrder = [...new Set([activeModel, ...availableModels])];
      let lastError = "";

      for (const modelName of tryOrder) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${config.geminiKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              system_instruction: { parts: [{ text: sysPrompt }] },
              contents: history.slice(-14)
            })
          });
          const data = await res.json();

          if (res.ok && data?.candidates?.[0]?.content?.parts?.[0]?.text) {
            activeModel = modelName;
            apiHealthTag.textContent = "API: ONLINE ✔";

            const reply = data.candidates[0].content.parts[0].text;
            history.push({ role: "model", parts: [{ text: reply }] });
            addLog("zoya", reply);
            saveMemory("zoya", reply);
            await speak(reply);
            return;
          } else {
            lastError = data?.error?.message || `HTTP ${res.status}`;
          }
        } catch (err) {
          lastError = err.message;
        }
      }

      apiHealthTag.textContent = "API: ERROR ✖";
      addLog("alert", `Connection issue (${lastError}). Admin panel mein key check karo Reza.`);
      resumeLiveListening();
    }

    // 9. Continuous Voice Recognition Setup
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRec) {
      recognition = new SpeechRec();
      recognition.lang = "hi-IN";
      recognition.interimResults = false;
      recognition.continuous = false;

      recognition.onstart = () => {
        if (!isBusy && isLiveVoice) setCoreState("listening");
      };

      recognition.onresult = (e) => {
        if (isBusy) return;
        const transcript = e.results[0][0].transcript.trim();
        if (!transcript) return;

        if (lastSpokenText && lastSpokenText.includes(transcript.toLowerCase())) {
          return;
        }

        sendPrompt(transcript);
      };

      recognition.onerror = (e) => {
        if (e.error === "not-allowed") {
          isLiveVoice = false;
          isBusy = false;
          liveVoiceBtn.classList.remove("active");
          setCoreState("idle");
          addLog("alert", "Mic permission blocked hai Reza. Browser settings se allow kar do.");
        }
      };

      recognition.onend = () => {
        if (isLiveVoice && !isBusy) {
          startListeningSafely();
        }
      };

        if (activeAudio) { activeAudio.pause(); activeAudio = null; }
        if ("speechSynthesis" in window) window.speechSynthesis.cancel();
        setCoreState("idle");
      }

    });

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("adminEmail").value.trim();
      const pass = document.getElementById("adminPass").value;
      const errEl = document.getElementById("loginErr");
      errEl.textContent = "";
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (_) {
        errEl.textContent = "Login failed: Email ya password galat hai.";
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => signOut(auth));

    document.getElementById("testVoiceBtn").addEventListener("click", async () => {
      config.elevenKey = document.getElementById("elevenKeyInput").value.trim();
      config.elevenVoiceId = elevenVoiceInput.value.trim() || "21m00Tcm4TlvDq8ikWAM";
      updateVoiceStatusBadge();
      await speak("Hey Reza, dekho meri nayi aawaz ab kaisi lag rahi hai?");
    });

    document.getElementById("saveKeysBtn").addEventListener("click", async () => {
      const geminiKey = document.getElementById("geminiKeyInput").value.trim();
      const elevenKey = document.getElementById("elevenKeyInput").value.trim();
      const elevenVoiceId = elevenVoiceInput.value.trim() || "21m00Tcm4TlvDq8ikWAM";
      const msgEl = document.getElementById("saveMsg");

      try {
        await setDoc(doc(db, "zoya_config", "api_keys"), { geminiKey, elevenKey, elevenVoiceId });
        config = { geminiKey, elevenKey, elevenVoiceId };
        updateVoiceStatusBadge();
        msgEl.style.color = "#00ff88";
        msgEl.textContent = "✅ Keys & Voice saved!";
        await verifyGeminiKey();
      } catch (e) {
        msgEl.style.color = "#ff004c";
        msgEl.textContent = "Error: " + e.message;
      }
    });

    await loadConfig();
    await loadMemory();
  </script>
</body>
</html>
